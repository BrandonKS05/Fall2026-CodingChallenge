# This folder contains a package.json, but only as a hook so `pnpm dev` can start
# the service alongside the rest of the app. Railway's builder would see that file
# and try to build a Node service. Say plainly what this is.
providers = ["python"]

[start]
# Railway's private network is IPv6, so binding 0.0.0.0 would listen on IPv4
# only and nothing inside the project could reach it. `::` takes both.
cmd = "uvicorn app.main:app --host :: --port ${PORT:-8000}"
