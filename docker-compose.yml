# Local development database only. The app itself runs with `pnpm dev`.
# Host port defaults to 5434 so it does not clash with a Postgres already on 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: trove-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: trove
      POSTGRES_DB: trove
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trove -d trove"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
