# Local development database only. The app itself runs with `pnpm dev`.
# Host port defaults to 5434 so it does not clash with a Postgres already on 5432.
#
# pgvector's own image rather than the plain one: recommendations store vectors
# in Postgres, and `CREATE EXTENSION vector` needs the extension to be present
# in the image. It is the official postgres:17 with the extension compiled in.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: wumboo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wumboo
      POSTGRES_PASSWORD: wumboo
      POSTGRES_DB: wumboo
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - wumboo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wumboo -d wumboo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wumboo-db-data:
